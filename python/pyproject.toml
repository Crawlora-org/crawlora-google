[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crawlora-google"
version = "0.2.0"
description = "Crawlora Google API client with 40 endpoints for Maps search, places, reviews and photos; News; Trends; Finance quotes and markets; suggestions; videos; and jobs"
readme = "README.md"
keywords = ["crawlora", "api-client", "sdk", "web-scraping", "scraping-api", "google", "google-api", "google-scraper", "google-data", "google-maps-search", "google-places", "google-reviews-photos", "google-news", "google-trends", "google-finance-quotes-markets", "google-suggestions", "google-videos", "google-jobs"]
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Crawlora" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Typing :: Typed",
]
dependencies = ["typing-extensions>=4.7; python_version < '3.11'"]

[project.optional-dependencies]
async = ["httpx>=0.27"]
test = ["mypy>=1.11", "pytest>=8"]

[project.urls]
Homepage = "https://crawlora.net/?utm_source=pypi&utm_medium=referral&utm_campaign=platform-clients&utm_content=google-python-homepage"
Documentation = "https://crawlora.net/docs?utm_source=pypi&utm_medium=referral&utm_campaign=platform-clients&utm_content=google-python-api-docs"
Repository = "https://github.com/Crawlora-org/crawlora-google"

[tool.setuptools.packages.find]
where = ["."]
include = ["crawlora_google"]

[tool.setuptools.package-data]
"crawlora_google" = ["py.typed", "*.pyi"]
